:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#182443;background:#f4f6fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#14295c,#3754a3);color:white;text-align:center;padding:34px 16px 30px}header .brand{font-weight:900;font-size:18px}header h1{font-size:clamp(24px,5vw,35px);margin:14px 0 8px}header p{margin:0;color:#dce5ff}.wrap{max-width:850px;margin:24px auto;padding:0 15px 70px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 6px 22px #172c6412;margin-bottom:18px}.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;background:#e8eeff;color:#2949a0;padding:6px 11px;border-radius:50px;font-size:13px;font-weight:800}.muted{color:#69758b;font-size:14px}.progress{height:9px;border-radius:20px;background:#e9edf7;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:#4167d9;transition:width .2s}.question{border:1px solid #e5e9f4;border-radius:15px;padding:19px;margin:15px 0}.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.han{border:0;background:transparent;font-size:clamp(22px,4vw,34px);font-weight:850;color:#142d73;cursor:pointer;padding:9px 0;text-align:left;line-height:1.55;overflow-wrap:anywhere}.han:hover{text-decoration:underline}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.opt{border:1px solid #dce2ef;background:#fff;border-radius:10px;text-align:left;padding:13px 12px;min-height:53px;cursor:pointer;font-size:15px;color:#26334c;line-height:1.5}.opt.selected{background:#e7eeff;border-color:#4167d9;font-weight:700}.opt:disabled{cursor:default}.opt.correct{background:#e7f7ec;border-color:#43a565}.opt.wrong{background:#fff0ee;border-color:#e3685a}.feedback{margin-top:13px;background:#fff4e8;border-left:4px solid #e6a246;padding:12px;border-radius:6px;line-height:1.7}.btns{display:flex;flex-wrap:wrap;gap:9px}.btn{border:0;border-radius:11px;padding:13px 17px;background:#2949a0;color:white;font-weight:800;font-size:15px;cursor:pointer}.btn.secondary{background:#e8edfa;color:#213d84}.btn:disabled{opacity:.45;cursor:not-allowed}.score{font-size:30px;font-weight:900;color:#233f91;margin:10px 0}.hidden{display:none!important}footer{text-align:center;color:#8791a6;font-size:13px;padding-top:20px}@media(max-width:550px){.options{grid-template-columns:1fr}.panel{padding:16px}.question{padding:15px}}

<header><div class="brand">합격킹 HSK</div><div style="margin-top:7px;font-weight:700">화선쌤 속사포 0-3급</div><h1>HSK 3급 필수단어 [6]</h1><p>한자를 눌러 발음을 듣고 알맞은 뜻을 골라보세요!</p></header>
<main class="wrap"><section class="panel"><div class="bar"><span id="mode" class="tag">전체 어휘 테스트</span><span class="muted" id="count"></span></div><div class="progress"><div id="fill" style="width:0"></div></div><p class="muted">기본단어는 기본단어 뜻끼리, 필수 기초구문은 기초구문 뜻끼리 출제됩니다. 예문은 문제에 표시하지 않습니다. 병음은 채점 후 오답에만 표시됩니다.</p><div class="btns"><button class="btn secondary" id="previous">이전 결과 다시 보기</button><button class="btn secondary" id="retry">틀린 문제 다시 풀기</button><button class="btn secondary" id="restart">처음부터 다시 풀기</button></div></section>
<section class="panel hidden" id="summary"></section><section id="questions"></section><div class="panel" id="submitbox"><button class="btn" id="grade" style="width:100%">채점하기</button><p class="muted" style="text-align:center;margin-bottom:0">선택하지 않은 문제는 오답 처리됩니다.</p></div><footer>합격킹 HSK · 화선쌤 속사포 0-3급</footer></main>
<script>
const DATA=[{"id": "basic0", "han": "马", "pinyin": "mǎ", "meaning": "[명] 말", "group": "basic", "speak": "马"}, {"id": "basic1", "han": "满意", "pinyin": "mǎnyì", "meaning": "[형] 만족하다, 만족스럽다", "group": "basic", "speak": "满意"}, {"id": "basic2", "han": "猫", "pinyin": "māo", "meaning": "[명] 고양이", "group": "basic", "speak": "猫"}, {"id": "basic3", "han": "帽子", "pinyin": "màozi", "meaning": "[명] 모자", "group": "basic", "speak": "帽子"}, {"id": "basic4", "han": "每", "pinyin": "měi", "meaning": "[명] 매, 각, ~마다", "group": "basic", "speak": "每"}, {"id": "basic5", "han": "门", "pinyin": "mén", "meaning": "[명] 문", "group": "basic", "speak": "门"}, {"id": "basic6", "han": "米", "pinyin": "mǐ", "meaning": "[명] 쌀", "group": "basic", "speak": "米"}, {"id": "basic7", "han": "米饭", "pinyin": "mǐfàn", "meaning": "[명] 쌀밥", "group": "basic", "speak": "米饭"}, {"id": "basic8", "han": "面包", "pinyin": "miànbāo", "meaning": "[명] 빵", "group": "basic", "speak": "面包"}, {"id": "basic9", "han": "面条", "pinyin": "miàntiáo", "meaning": "[명] 국수", "group": "basic", "speak": "面条"}, {"id": "basic10", "han": "明白", "pinyin": "míngbai", "meaning": "[동] 이해하다, 알다", "group": "basic", "speak": "明白"}, {"id": "basic11", "han": "拿", "pinyin": "ná", "meaning": "[동] 잡다, 들다, 가져오다, 꺼내다", "group": "basic", "speak": "拿"}, {"id": "basic12", "han": "难", "pinyin": "nán", "meaning": "[형] 어렵다", "group": "basic", "speak": "难"}, {"id": "basic13", "han": "容易", "pinyin": "róngyì", "meaning": "[형] 쉽다", "group": "basic", "speak": "容易"}, {"id": "basic14", "han": "难过", "pinyin": "nánguò", "meaning": "[형] 슬프다", "group": "basic", "speak": "难过"}, {"id": "basic15", "han": "难受", "pinyin": "nánshòu", "meaning": "[형] 괴롭다, 견딜 수 없다", "group": "basic", "speak": "难受"}, {"id": "basic16", "han": "年级", "pinyin": "niánjí", "meaning": "[명] 학년", "group": "basic", "speak": "年级"}, {"id": "basic17", "han": "鸟", "pinyin": "niǎo", "meaning": "[명] 새", "group": "basic", "speak": "鸟"}, {"id": "basic18", "han": "牛奶", "pinyin": "niúnǎi", "meaning": "[명] 우유", "group": "basic", "speak": "牛奶"}, {"id": "basic19", "han": "努力", "pinyin": "nǔlì", "meaning": "[동/형] 열심히 하다, 노력하다", "group": "basic", "speak": "努力"}, {"id": "basic20", "han": "认真", "pinyin": "rènzhēn", "meaning": "[형] 성실하다", "group": "basic", "speak": "认真"}, {"id": "basic21", "han": "盘子", "pinyin": "pánzi", "meaning": "[명] 접시, 쟁반", "group": "basic", "speak": "盘子"}, {"id": "basic22", "han": "胖", "pinyin": "pàng", "meaning": "[형] 뚱뚱하다", "group": "basic", "speak": "胖"}, {"id": "basic23", "han": "瘦", "pinyin": "shòu", "meaning": "[형] 날씬하다, 마르다", "group": "basic", "speak": "瘦"}, {"id": "basic24", "han": "批评", "pinyin": "pīpíng", "meaning": "[명/동] 비판(하다)", "group": "basic", "speak": "批评"}, {"id": "basic25", "han": "皮鞋", "pinyin": "píxié", "meaning": "[명] 구두", "group": "basic", "speak": "皮鞋"}, {"id": "basic26", "han": "鞋子", "pinyin": "xiézi", "meaning": "[명] 신발", "group": "basic", "speak": "鞋子"}, {"id": "basic27", "han": "啤酒", "pinyin": "píjiǔ", "meaning": "[명] 맥주", "group": "basic", "speak": "啤酒"}, {"id": "basic28", "han": "瓶子", "pinyin": "píngzi", "meaning": "[명] 병", "group": "basic", "speak": "瓶子"}, {"id": "basic29", "han": "票", "pinyin": "piào", "meaning": "[명] 표, 티켓", "group": "basic", "speak": "票"}, {"id": "pattern0", "han": "对…来说", "pinyin": "duì…láishuō", "meaning": "~의 입장에서 말하자면", "group": "pattern", "speak": "对我来说"}, {"id": "pattern1", "han": "又…又… / 既…又…", "pinyin": "yòu…yòu… / jì…yòu…", "meaning": "~하기도 하고 ~하기도 하다", "group": "pattern", "speak": "妹妹又高又瘦"}, {"id": "pattern2", "han": "一边…，一边…", "pinyin": "yìbiān…, yìbiān…", "meaning": "~하면서, ~하다", "group": "pattern", "speak": "一边吃饭一边聊天"}, {"id": "pattern3", "han": "(就/快)要…了", "pinyin": "(jiù/kuài) yào…le", "meaning": "(곧) ~할 것이다, 하려고 하다", "group": "pattern", "speak": "就要考试了"}, {"id": "pattern4", "han": "快…了", "pinyin": "kuài…le", "meaning": "곧 ~이다", "group": "pattern", "speak": "电影快开始了"}, {"id": "pattern5", "han": "都…了", "pinyin": "dōu…le", "meaning": "이미, 벌써 ~이다", "group": "pattern", "speak": "都十点了"}, {"id": "pattern6", "han": "越来越…了", "pinyin": "yuèláiyuè…le", "meaning": "점점 더 ~하다", "group": "pattern", "speak": "越来越热了"}, {"id": "pattern7", "han": "越…越…", "pinyin": "yuè…yuè…", "meaning": "~할수록 ~하다", "group": "pattern", "speak": "越学越有意思"}, {"id": "pattern8", "han": "跟…一样 / 不一样 / 跟…差不多", "pinyin": "gēn…yíyàng / bùyíyàng / gēn…chàbuduō", "meaning": "~와 같다 / 다르다 / ~와 비슷하다", "group": "pattern", "speak": "跟我一样"}, {"id": "pattern9", "han": "像…一样", "pinyin": "xiàng…yíyàng", "meaning": "마치 ~와 같다", "group": "pattern", "speak": "像以前一样"}, {"id": "pattern10", "han": "多+동사+点儿(吧)", "pinyin": "duō + 동사 + diǎnr(ba)", "meaning": "~좀 많이 하세요", "group": "pattern", "speak": "多穿点儿衣服吧"}, {"id": "pattern11", "han": "一点儿也/都+不、没", "pinyin": "yìdiǎnr yě/dōu + bù, méi", "meaning": "조금도, 하나도 ~하지 않다", "group": "pattern", "speak": "一点儿也不害怕"}, {"id": "pattern12", "han": "没想到", "pinyin": "méi xiǎngdào", "meaning": "생각지 못하다, 예상치 못하다", "group": "pattern", "speak": "没想到"}, {"id": "pattern13", "han": "帮(助)+사람+동사", "pinyin": "bāng(zhù) + 사람 + 동사", "meaning": "~를 도와서 ~해 주다", "group": "pattern", "speak": "帮你搬"}, {"id": "pattern14", "han": "不但…，而且…", "pinyin": "búdàn…, érqiě…", "meaning": "~할 뿐만 아니라, 게다가 ~하다", "group": "pattern", "speak": "不但好而且便宜"}];
const STORE='hsk_3_part6_last_v1';
const byId=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],answers={},graded=false,wrong=[],mode='전체 어휘 테스트';
function speak(word){if(!('speechSynthesis'in window)){alert('이 브라우저에서는 음성 읽기를 지원하지 않습니다.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='zh-CN';u.rate=.78;const voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('zh-cn'))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}
function choiceList(q){let pool=DATA.filter(x=>x.group===q.group&&x.meaning!==q.meaning);let distinct=[...new Set(pool.map(x=>x.meaning))];return shuffle([q.meaning,...shuffle(distinct).slice(0,3)])}
function start(items=DATA,label='전체 어휘 테스트'){questions=shuffle(items).map(q=>({...q,choices:choiceList(q)}));answers={};graded=false;wrong=[];mode=label;render();window.scrollTo(0,0)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){byId('mode').textContent=mode;byId('summary').classList.add('hidden');byId('submitbox').classList.remove('hidden');byId('grade').disabled=false;const root=byId('questions');root.innerHTML='';questions.forEach((q,i)=>{const el=document.createElement('article');el.className='panel question';let opts=q.choices.map((c,j)=>`<button class="opt" data-choice="${j}" type="button">${escapeHTML(c)}</button>`).join('');el.innerHTML=`<div class="qhead"><span class="tag">${q.group==='basic'?'기본단어':'필수 기초구문'} · ${i+1}번</span><span class="muted">🔊 한자 클릭</span></div><button class="han" type="button" title="중국어 발음 듣기">${escapeHTML(q.han)}</button><div class="options">${opts}</div><div class="feedback hidden"></div>`;el.querySelector('.han').addEventListener('click',()=>speak(q.speak));el.querySelectorAll('.opt').forEach((b,j)=>b.addEventListener('click',()=>{if(graded)return;answers[q.id]=q.choices[j];el.querySelectorAll('.opt').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');updateProgress()}));root.appendChild(el)});updateProgress();let hasPrev=false;try{hasPrev=!!localStorage.getItem(STORE)}catch(e){}byId('previous').disabled=!hasPrev;byId('retry').disabled=true}
function updateProgress(){let n=questions.filter(q=>answers[q.id]!==undefined).length;byId('count').textContent=`${n} / ${questions.length}문제 선택`;byId('fill').style.width=`${questions.length?100*n/questions.length:0}%`}
function paintGrade(){wrong=[];questions.forEach((q,i)=>{let correct=answers[q.id]===q.meaning;if(!correct)wrong.push(q.id);let el=byId('questions').children[i];el.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.meaning)b.classList.add('correct');if(b.textContent===answers[q.id]&&!correct)b.classList.add('wrong')});if(!correct){let f=el.querySelector('.feedback');f.classList.remove('hidden');f.innerHTML=`<strong>오답 · 정답 확인</strong><div>병음: ${escapeHTML(q.pinyin)}</div><div>뜻: ${escapeHTML(q.meaning)}</div>`}});byId('retry').disabled=wrong.length===0;showSummary()}
function grade(){if(graded)return;graded=true;paintGrade();let record={items:questions.map(q=>({id:q.id,choices:q.choices})),answers:{...answers},mode,at:new Date().toLocaleString('ko-KR')};try{localStorage.setItem(STORE,JSON.stringify(record))}catch(e){}byId('grade').disabled=true;byId('previous').disabled=false;window.scrollTo({top:0,behavior:'smooth'})}
function showSummary(){let correct=questions.length-wrong.length;let s=byId('summary');s.classList.remove('hidden');s.innerHTML=`<div class="tag">채점 결과</div><div class="score">${correct} / ${questions.length}문제 정답 · ${questions.length?Math.round(correct/questions.length*100):0}점</div><p class="muted">틀린 문제 ${wrong.length}개 · 틀린 문제 아래에서 병음과 뜻을 확인하세요.</p>`}
function previous(){let record;try{record=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!record||!Array.isArray(record.items)){alert('저장된 이전 결과가 없습니다.');return}questions=record.items.map(item=>{let q=DATA.find(x=>x.id===item.id);return q?{...q,choices:item.choices}:null}).filter(Boolean);answers=record.answers||{};mode=(record.mode||'전체 어휘 테스트')+' · 이전 결과';graded=false;render();graded=true;paintGrade();byId('submitbox').classList.add('hidden');window.scrollTo(0,0)}
byId('grade').addEventListener('click',grade);byId('restart').addEventListener('click',()=>start());byId('retry').addEventListener('click',()=>{if(!graded||!wrong.length)return;start(DATA.filter(q=>wrong.includes(q.id)),'틀린 문제 다시 풀기')});byId('previous').addEventListener('click',previous);start();
</script></body></html>
